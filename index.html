<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurateur Manette PS4</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px;
      text-align: center;
      border-bottom: 1px solid #222;
    }

    h1 {
      font-size: 1.3rem;
      font-weight: 600;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 15px;
      gap: 30px;
    }

    .preview {
      width: 100%;
      max-width: 520px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      border-radius: 16px;
      padding: 25px;
      border: 1px solid #222;
    }

    .controller-img {
      width: 100%;
      max-width: 460px;
      height: auto;
      transition: opacity 0.25s ease;
    }

    .section {
      text-align: center;
    }

    .section h2 {
      font-size: 0.9rem;
      color: #777;
      margin-bottom: 14px;
      font-weight: 500;
    }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 520px;
    }

    button {
      background: #1f1f1f;
      color: #fff;
      border: 1px solid #444;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    button:hover {
      background: #2a2a2a;
      border-color: #666;
    }

    button.active {
      background: #3b82f6;
      border-color: #3b82f6;
    }
  </style>
</head>
<body>
  <header>
    <h1>Configurateur Manette PS4</h1>
  </header>

  <main>
    <div class="preview">
      <img 
        id="controller"
        class="controller-img"
        src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/59/DualShock_4.jpg/1280px-DualShock_4.jpg"
        alt="Manette PS4"
      >
    </div>

    <div class="section">
      <h2>Choisis ta couleur</h2>
      <div class="controls" id="controls">
        <button onclick="changeColor('black')" class="active">Noir</button>
        <button onclick="changeColor('white')">Blanc</button>
        <button onclick="changeColor('blue')">Bleu</button>
        <button onclick="changeColor('red')">Rouge</button>
        <button onclick="changeColor('gold')">Doré</button>
      </div>
    </div>
  </main>

  <script>
    // Images de DualShock 4 (sources publiques)
    const images = {
      black: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/59/DualShock_4.jpg/1280px-DualShock_4.jpg",
      white: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8c/DualShock_4_White.jpg/1280px-DualShock_4_White.jpg",
      blue: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/59/DualShock_4.jpg/1280px-DualShock_4.jpg",
      red: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/59/DualShock_4.jpg/1280px-DualShock_4.jpg",
      gold: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/59/DualShock_4.jpg/1280px-DualShock_4.jpg"
    };

    function changeColor(color) {
      const img = document.getElementById('controller');
      
      img.style.opacity = 0.4;
      
      setTimeout(() => {
        img.src = images[color];
        img.style.opacity = 1;
      }, 180);

      // Active button
      document.querySelectorAll('#controls button').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
    }
  </script>
</body>
</html>

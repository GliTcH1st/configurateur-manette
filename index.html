<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurateur Manette Custom</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f0f;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #222;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      gap: 30px;
    }

    .preview {
      width: 320px;
      height: 220px;
      background: #1a1a1a;
      border: 2px solid #333;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .controller {
      width: 260px;
      height: 160px;
      background: #2a2a2a;
      border-radius: 30px;
      position: relative;
      transition: background 0.3s ease;
    }

    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      background: #222;
      color: #fff;
      border: 1px solid #444;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s;
    }

    button:hover {
      background: #333;
      border-color: #666;
    }

    button.active {
      background: #3b82f6;
      border-color: #3b82f6;
    }
  </style>
</head>
<body>
  <header>
    <h1>Configurateur Manette Custom</h1>
  </header>

  <main>
    <div class="preview">
      <div class="controller" id="controller"></div>
    </div>

    <div class="controls">
      <button onclick="changeColor('#2a2a2a')" class="active">Noir</button>
      <button onclick="changeColor('#1e3a5f')">Bleu</button>
      <button onclick="changeColor('#3d1a1a')">Rouge</button>
      <button onclick="changeColor('#1a3d1a')">Vert</button>
      <button onclick="changeColor('#3d3d1a')">Jaune</button>
      <button onclick="changeColor('#ffffff')">Blanc</button>
    </div>
  </main>

  <script>
    function changeColor(color) {
      document.getElementById('controller').style.background = color;
      document.querySelectorAll('button').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
    }
  </script>
</body>
</html>

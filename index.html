<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurateur Manette Custom</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f0f;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #222;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      gap: 40px;
    }

    .preview {
      width: 360px;
      height: 240px;
      background: #1a1a1a;
      border: 2px solid #333;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .controller {
      width: 300px;
      height: 180px;
      background: #2a2a2a;
      border-radius: 40px;
      position: relative;
      transition: background 0.3s ease;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    /* Sticks */
    .stick {
      width: 48px;
      height: 48px;
      background: #111;
      border-radius: 50%;
      position: absolute;
      border: 3px solid #444;
    }
    .stick-left { top: 70px; left: 40px; }
    .stick-right { top: 70px; right: 40px; }

    /* D-pad */
    .dpad {
      position: absolute;
      top: 55px;
      left: 110px;
      width: 50px;
      height: 50px;
    }
    .dpad::before, .dpad::after {
      content: '';
      position: absolute;
      background: #111;
      border-radius: 4px;
    }
    .dpad::before {
      width: 18px;
      height: 50px;
      left: 16px;
    }
    .dpad::after {
      width: 50px;
      height: 18px;
      top: 16px;
    }

    /* Boutons A B X Y */
    .buttons {
      position: absolute;
      top: 55px;
      right: 110px;
      width: 60px;
      height: 60px;
    }
    .btn {
      width: 22px;
      height: 22px;
      background: #111;
      border-radius: 50%;
      position: absolute;
      border: 2px solid #444;
    }
    .btn-y { top: 0; left: 19px; background: #f1c40f; }
    .btn-x { top: 19px; left: 0; background: #3498db; }
    .btn-b { top: 19px; right: 0; background: #e74c3c; }
    .btn-a { bottom: 0; left: 19px; background: #2ecc71; }

    /* Triggers */
    .trigger {
      width: 50px;
      height: 14px;
      background: #111;
      border-radius: 6px;
      position: absolute;
      top: 18px;
    }
    .trigger-l { left: 40px; }
    .trigger-r { right: 40px; }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 400px;
    }

    button {
      background: #222;
      color: #fff;
      border: 1px solid #444;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    button:hover {
      background: #333;
      border-color: #666;
    }

    button.active {
      background: #3b82f6;
      border-color: #3b82f6;
    }
  </style>
</head>
<body>
  <header>
    <h1>Configurateur Manette Custom</h1>
  </header>

  <main>
    <div class="preview">
      <div class="controller" id="controller">
        <div class="trigger trigger-l"></div>
        <div class="trigger trigger-r"></div>
        <div class="stick stick-left"></div>
        <div class="stick stick-right"></div>
        <div class="dpad"></div>
        <div class="buttons">
          <div class="btn btn-y"></div>
          <div class="btn btn-x"></div>
          <div class="btn btn-b"></div>
          <div class="btn btn-a"></div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button onclick="changeColor('#2a2a2a')" class="active">Noir</button>
      <button onclick="changeColor('#1e3a5f')">Bleu</button>
      <button onclick="changeColor('#3d1a1a')">Rouge</button>
      <button onclick="changeColor('#1a3d1a')">Vert</button>
      <button onclick="changeColor('#3d3d1a')">Jaune</button>
      <button onclick="changeColor('#ffffff')">Blanc</button>
      <button onclick="changeColor('#4a1a6b')">Violet</button>
      <button onclick="changeColor('#1a4a4a')">Turquoise</button>
    </div>
  </main>

  <script>
    function changeColor(color) {
      document.getElementById('controller').style.background = color;
      document.querySelectorAll('.controls button').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
    }
  </script>
</body>
</html>

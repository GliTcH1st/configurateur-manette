<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurateur Manette PS4</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px;
      text-align: center;
      border-bottom: 1px solid #222;
    }

    h1 { font-size: 1.35rem; font-weight: 600; }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 15px;
      gap: 30px;
    }

    .preview {
      width: 100%;
      max-width: 520px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .controller-img {
      width: 100%;
      max-width: 480px;
      height: auto;
      transition: filter 0.35s ease;
      filter: brightness(1) hue-rotate(0deg) saturate(1);
    }

    .section {
      text-align: center;
    }

    .section h2 {
      font-size: 0.9rem;
      color: #777;
      margin-bottom: 12px;
      font-weight: 500;
    }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 480px;
    }

    button {
      background: #1f1f1f;
      color: #fff;
      border: 1px solid #444;
      padding: 9px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    button:hover {
      background: #2a2a2a;
      border-color: #666;
    }

    button.active {
      background: #3b82f6;
      border-color: #3b82f6;
    }
  </style>
</head>
<body>
  <header>
    <h1>Configurateur Manette PS4</h1>
  </header>

  <main>
    <div class="preview">
      <img 
        src="https://www.pngkey.com/png/full/199-1998054_playstation-sony-dualshock-4-gamepad-black.png" 
        alt="Manette PS4" 
        class="controller-img" 
        id="controller"
      >
    </div>

    <div class="section">
      <h2>Couleur de la coque</h2>
      <div class="controls" id="shell-controls">
        <button onclick="changeColor('none')" class="active">Noir</button>
        <button onclick="changeColor('blue')">Bleu</button>
        <button onclick="changeColor('red')">Rouge</button>
        <button onclick="changeColor('green')">Vert</button>
        <button onclick="changeColor('purple')">Violet</button>
        <button onclick="changeColor('cyan')">Turquoise</button>
        <button onclick="changeColor('gold')">Doré</button>
        <button onclick="changeColor('white')">Blanc</button>
      </div>
    </div>
  </main>

  <script>
    function changeColor(type) {
      const img = document.getElementById('controller');

      // Reset
      img.style.filter = 'brightness(1) hue-rotate(0deg) saturate(1)';

      if (type === 'blue') {
        img.style.filter = 'brightness(0.95) hue-rotate(200deg) saturate(1.4)';
      }
      if (type === 'red') {
        img.style.filter = 'brightness(0.9) hue-rotate(320deg) saturate(1.6)';
      }
      if (type === 'green') {
        img.style.filter = 'brightness(0.95) hue-rotate(90deg) saturate(1.5)';
      }
      if (type === 'purple') {
        img.style.filter = 'brightness(0.9) hue-rotate(250deg) saturate(1.5)';
      }
      if (type === 'cyan') {
        img.style.filter = 'brightness(1) hue-rotate(160deg) saturate(1.4)';
      }
      if (type === 'gold') {
        img.style.filter = 'brightness(1.15) hue-rotate(35deg) saturate(1.8)';
      }
      if (type === 'white') {
        img.style.filter = 'brightness(2.2) saturate(0) contrast(1.1)';
      }

      // Active button
      document.querySelectorAll('#shell-controls button').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
    }
  </script>
</body>
</html>

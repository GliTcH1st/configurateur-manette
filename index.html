<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurateur Manette PS4 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: #0a0a0a;
      color: #fff;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 14px;
      text-align: center;
      border-bottom: 1px solid #222;
      z-index: 10;
    }
    h1 { font-size: 1.2rem; font-weight: 600; }
    #canvas-container {
      flex: 1;
      position: relative;
    }
    canvas { display: block; width: 100% !important; height: 100% !important; }
    .controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      z-index: 10;
      max-width: 95%;
    }
    button {
      background: #1f1f1f;
      color: #fff;
      border: 1px solid #444;
      padding: 9px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    button:hover { background: #2a2a2a; }
    button.active { background: #3b82f6; border-color: #3b82f6; }
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #aaa;
      font-size: 1rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <h1>Configurateur Manette PS4 — 3D</h1>
  </header>

  <div id="canvas-container">
    <div class="loading" id="loading">Chargement...</div>
  </div>

  <div class="controls" id="controls" style="display:none;">
    <button onclick="changeColor(0x2b2b2b)" class="active">Noir</button>
    <button onclick="changeColor(0x1a3a6e)">Bleu</button>
    <button onclick="changeColor(0x8b1a1a)">Rouge</button>
    <button onclick="changeColor(0x1a5c1a)">Vert</button>
    <button onclick="changeColor(0xf0f0f0)">Blanc</button>
    <button onclick="changeColor(0x5a1a8b)">Violet</button>
    <button onclick="changeColor(0x1a5c5c)">Turquoise</button>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const container = document.getElementById('canvas-container');
    const loading = document.getElementById('loading');
    const controlsDiv = document.getElementById('controls');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
    // Caméra plus loin
    camera.position.set(0, 0.5, 3.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.9));
    
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.6);
    dirLight.position.set(5, 8, 6);
    scene.add(dirLight);

    const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.6);
    dirLight2.position.set(-5, 3, -4);
    scene.add(dirLight2);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0, 0);
    controls.minDistance = 1.5;
    controls.maxDistance = 6;

    let bodyMaterials = [];

    const loader = new GLTFLoader();

    loader.load(
      './dualshock_4_playstation_controller%202.glb',
      (gltf) => {
        const model = gltf.scene;

        // Centrer parfaitement
        const box = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());

        model.position.sub(center);
        const maxDim = Math.max(size.x, size.y, size.z);
        const scale = 2.2 / maxDim;
        model.scale.setScalar(scale);
        model.rotation.y = Math.PI;

        // On récupère uniquement les matériaux qui semblent être la coque
        model.traverse((child) => {
          if (child.isMesh && child.material) {
            const mats = Array.isArray(child.material) ? child.material : [child.material];
            mats.forEach(mat => {
              // On clone et on garde ceux qui ont une couleur (pas les textures complexes de boutons)
              const cloned = mat.clone();
              if (cloned.color) {
                bodyMaterials.push(cloned);
                // On remplace le matériau sur le mesh
                if (Array.isArray(child.material)) {
                  const idx = child.material.indexOf(mat);
                  if (idx !== -1) child.material[idx] = cloned;
                } else {
                  child.material = cloned;
                }
              }
            });
          }
        });

        scene.add(model);
        loading.style.display = 'none';
        controlsDiv.style.display = 'flex';
      },
      (xhr) => {
        if (xhr.total) {
          loading.textContent = `Chargement... ${Math.round(xhr.loaded / xhr.total * 100)}%`;
        }
      },
      (error) => {
        console.error(error);
        loading.textContent = 'Erreur de chargement';
      }
    );

    window.changeColor = function(hex) {
      bodyMaterials.forEach(mat => {
        if (mat.color) {
          mat.color.setHex(hex);
        }
      });
      document.querySelectorAll('#controls button').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
    };

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
